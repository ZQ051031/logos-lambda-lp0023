name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RISC0_SKIP_BUILD: "1"

jobs:
  check:
    name: Format, lint, unit tests, IDL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Registry IDL matches the guest source (SPEL IDL generator)
        run: |
          cargo run -q --locked -p idl-gen -- programs/registry/methods/guest/src/bin/lez_registry.rs > /tmp/idl.json
          diff -u artifacts/lez_registry-idl.json /tmp/idl.json

  e2e:
    name: E2E against a standalone LEZ sequencer and Logos Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RISC0_SKIP_BUILD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libssl-dev pkg-config clang libclang-dev unzip
      - name: Install cargo-risczero (Docker guest builds)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install cargo-risczero 3.0.5
          "$HOME/.risc0/bin/rzup" install rust 1.97.0
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .e2e/src
            .e2e/storage/logos-storage-*
            target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/e2e-standalone.sh') }}
          restore-keys: e2e-${{ runner.os }}-
      - name: Run E2E (clean-environment demo)
        run: ./scripts/e2e-standalone.sh
      - name: Logs
        if: failure()
        run: tail -n 200 .e2e/logs/*.log || true

  module:
    name: Logos Core Module (mkLogosModule)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the module with logos-module-builder
        run: nix build ./modules/registry --print-build-logs
