[package]
name = "registry-guest"
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0"

[workspace]

# Part of the reproducible build configuration: changing it changes the ImageID.
[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "lez_registry"
path = "src/bin/lez_registry.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "c6f73ce21e4805f8430f03afdbdedf0b7e479a5e", package = "spel-framework" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
# risc0 guest toolchain ships rustc 1.88; ruint 1.18+ needs 1.90 (same pin as lez-programs).
ruint = { version = "=1.17.0", default-features = false }
registry_core = { path = "../../core" }
registry_program = { path = "../..", package = "registry_program" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
