[package]
name = "registry-cycle-bench"
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0"
publish = false

# Own workspace: excluded from the main workspace because it needs the heavy
# risc0-zkvm `prove` feature for the executor's cycle split. Run with:
#   cargo run --release --manifest-path benchmark/Cargo.toml -- <lez_registry.bin>
[workspace]

[dependencies]
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", features = ["host"] }
registry_core = { path = "../programs/registry/core" }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "c6f73ce21e4805f8430f03afdbdedf0b7e479a5e" }
risc0-zkvm = { version = "=3.0.5", features = ["prove"] }
risc0-binfmt = "=3.0.4"
