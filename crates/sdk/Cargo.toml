[package]
name = "lez-registry-sdk"
description = "Client SDK for the LEZ Program Registry: lookup, enumeration, search, IDL resolution, Logos Storage and source verification"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", features = ["host"] }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "c6f73ce21e4805f8430f03afdbdedf0b7e479a5e", package = "spel-framework-core" }
registry_core = { path = "../../programs/registry/core" }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", default-features = false, features = ["json"] }
sha2 = "0.10"
hex = "0.4"
risc0-binfmt = "3.0.4"
thiserror = "2"
