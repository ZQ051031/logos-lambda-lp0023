[workspace]
members = [
    "programs/registry/core",
    "programs/registry",
    "programs/registry/methods",
    "crates/sdk",
    "crates/cli",
    "modules/registry/ffi",
    "tools/idl-gen",
]
exclude = [
    "programs/registry/methods/guest",
    # Cycle benchmark: own workspace, run on demand (see docs/cycles.md).
    "benchmark",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0"
repository = "https://github.com/ZQ051031/logos-lambda-lp0023"

[workspace.dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", features = ["host"] }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", features = ["test-utils"] }
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "c6f73ce21e4805f8430f03afdbdedf0b7e479a5e", package = "spel-framework-core" }
spel-framework-macros = { git = "https://github.com/logos-co/spel.git", rev = "c6f73ce21e4805f8430f03afdbdedf0b7e479a5e", package = "spel-framework-macros" }
registry_core = { path = "programs/registry/core" }
registry_program = { path = "programs/registry" }
lez-registry-sdk = { path = "crates/sdk" }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5" }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1.28.2", features = ["net", "rt-multi-thread", "sync", "macros", "process", "fs"] }
